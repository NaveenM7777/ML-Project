<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 36px;
        }

        .subtitle {
            text-align: center;
            color: #f1f1f1;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: white;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 17px;
        }

        select,
        input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #764ba2;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🎓 Student Performance Prediction</h1>

            <p class="subtitle">
                Predict Student Mathematics Performance using Machine Learning
            </p>

            <form action="{{ url_for('predict_datapoint') }}" method="post">

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option disabled selected>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Race / Ethnicity</label>
                    <select name="ethnicity" required>
                        <option disabled selected>Select Group</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Parental Education</label>
                    <select name="parental_level_of_education" required>
                        <option disabled selected>Select Education</option>
                        <option value="associate's degree">Associate Degree</option>
                        <option value="bachelor's degree">Bachelor Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Lunch Type</label>
                    <select name="lunch" required>
                        <option disabled selected>Select Lunch Type</option>
                        <option value="free/reduced">Free / Reduced</option>
                        <option value="standard">Standard</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Test Preparation Course</label>
                    <select name="test_preparation_course" required>
                        <option disabled selected>Select Course Status</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Reading Score</label>
                    <input type="number" name="reading_score" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Writing Score</label>
                    <input type="number" name="writing_score" min="0" max="100" required>
                </div>

                <button type="submit">
                    🚀 Predict Maths Score
                </button>

            </form>

            {% if results %}
            <div class="result">
                🏆 Predicted Maths Score <br><br>
                {{ results }}
            </div>
            {% endif %}

        </div>

    </div>

</body>

</html>
